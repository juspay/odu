name: odu
version: 1.0.0
type: hybrid

target: claude

# Gate exactly what odu publishes to consumers (e.g. kolu). `includes` is an
# allow-list — only these paths ship. odu's agent face is its two skills; the
# odu MCP server ships separately via `dependencies.mcp` below. Internal dev
# guidance lives outside `.apm/` and is wired as a devDependency so consumers
# never pull it.
includes:
  - .apm/skills/odu/
  - .apm/skills/odu-mcp/

dependencies:
  # odu's agent face: consumers that depend on juspay/odu get the odu MCP
  # server wired into their .mcp.json (Claude) / .codex / .opencode. The
  # launcher resolves odu via Nix and serves `odu mcp` in the consumer's repo.
  mcp:
    - name: odu
      registry: false
      transport: stdio
      command: .agents/skills/odu-mcp/bin/serve
      # Serve odu from the repo it is installed into, not the published flake
      # the launcher otherwise defaults to (github:juspay/odu). In odu's own
      # checkout that is the dogfooding loop closing: the MCP face an agent
      # drives is built from the working branch, so a CI fix is testable
      # through the same tools it changes. Consumers re-export odu and this
      # resolves to their pinned output — kolu's is `./ci#odu`.
      env:
        ODU_FLAKE: .#odu

# Maintainer-only: deployed into odu's own .claude/ for odu developers, but
# excluded from what consumers receive (and from `apm pack`).
devDependencies:
  apm:
    - path: ./dev
    # srid/agency's review lenses (hickey/lowy/code-police, …): maintainer
    # tooling, never shipped to consumers.
    - srid/agency#master
    # kolu's authoring workflow (/be and its review lenses), deployed into odu's
    # own .claude/ for maintainers only — excluded from what consumers receive.
    - juspay/kolu/agents#master
