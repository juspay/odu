# odu runs odu: each platform job executes this repo's own [metadata("ci")]
# DAG with the odu built from the very commit under test — coordinator and
# lane on the same runner (a localhost lane), strict mode.
#
# It runs with --no-post: this workflow is the green/red Actions check only.
# Commit-status posting (the ci::<recipe>@<platform> contexts) is owned by the
# local / MCP-driven run, which holds the durable per-SHA logs the statuses
# point at — a status posted from here would reference logs on a runner that's
# already gone. So this job needs no statuses:write and no token.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  odu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR HEAD, not the synthetic merge ref, so the run
          # tests the sha the PR is actually about.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: nixbuild/nix-quick-install-action@v31
      - name: odu runs odu
        run: |
          nix run --accept-flake-config .#odu -- run \
            --no-post \
            --platform ${{ matrix.system }} \
            --host ${{ matrix.system }}=localhost
