# Build odu's outputs and push their closures to odu's OWN cache bucket, and
# then publish the lane runner CONTENT-ADDRESSED, so a dial from a published
# revision has the host pull its own build with NO trust
# (`@kolu/surface-remote`'s `provisionAgent` index step; the publisher is
# `juspay/kolu`'s `publish-closure` action, pinned to the kolu revision odu
# pins in `npins/sources.json`).
#
# TWO ORIGINS, ON PURPOSE: the flake ADVERTISES `https://cache.kolu.dev`, and
# until this PR deploys and that name is set neither job can talk to it. Both
# jobs therefore PUSH to the pod's live address,
# `https://odu-k3s.rooster-blues.ts.net` (the same daemon and the same `kolu`
# bucket, public through Funnel today) — a substituter that does not answer yet
# is a warning to Nix, not a failure. Two follow-ups, named in the PR: move the
# push origin back to `cache.kolu.dev` once live, and re-pin kolu's odu so the
# publish job chunks too. Nothing here depends on either.
#
# Two jobs, because they are two halves of one question with one ordering:
# `build-and-push` warms the input-addressed cache a lane host substitutes from
# (odu's own, with `odu cache push`), and `publish-closures` then rewrites from
# that same tree and pushes to the SAME bucket: the agent source bakes
# `pusher = { kind = "odu"; bucket = "kolu"; }` (kolu#2334), so the action runs
# `odu cache push` under `ODU_CACHE_TOKEN` and the checkout's own odu, which
# chunks. It must be its OWN job: the action installs the Nix it rewrites with
# (2.34.8 — see its `action.yml`), which has to be the job's only Nix.
#
# `odu`'s `ca-index` branch is born on the first master push. A pull request
# rewrites, smokes and import-verifies, and writes no index.
name: nix-cache

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege — only the publish job needs more, and it asks for it itself.
permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest → x86_64-linux; macos-latest → aarch64-darwin. Both are
        # platforms odu's own required checks (ci::*) run on, so both are
        # platforms whose closures a lane actually provisions.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # `ref:` is LOAD-BEARING on `pull_request`. actions/checkout defaults to
      # `github.ref`, which for that event is `refs/pull/N/merge` — a synthetic
      # merge of the PR into its base that NOTHING else ever builds. Developers
      # and odu's own lanes build the branch head, so warming the merge tree
      # leaves the tree everybody wants cold. `head.sha` is empty on non-PR
      # events, where checkout's own default is already the right tree. (This is
      # kolu#2101 F5(a)'s correction, kept here for the same reason.)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Pinned by commit (CodeQL: unpinned third-party action). v35 → 9f63be7.
      # Nix 2.34.7 here; the publish job installs 2.34.8 for the rewrite — see
      # its action. This job only builds and pushes, which either line does.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev
            extra-trusted-public-keys = kolu-1:eAXwD1RPt1BpFjrHfVUO8Ia0bK32WcuIeJcwFWmgj9Y=
            accept-flake-config = true

      # ONE step, not a step per branch, so the token is never consulted in an
      # `if`. A pull request with no token still BUILDS — that is the check this
      # workflow owes a PR — and pushes nothing. A push with no token FAILS: a
      # push is where this job is required to publish, and going green having
      # warmed nothing is precisely the state a cache job exists to make
      # impossible (kolu's nix-cache.yml states the rule).
      #
      # ODU PUSHES TO ITS OWN CACHE. `odu cache push` computes each closure,
      # asks the bucket what it is missing in one query, drops what an upstream
      # key signed (the server fetches those references itself), and chunks a
      # NAR too large for one request. The ORIGIN is the pod's live name until
      # `cache.kolu.dev` answers; the flake still advertises the latter.
      - name: Build odu's outputs, and push their closures
        env:
          ODU_CACHE_TOKEN: ${{ secrets.ODU_CACHE_TOKEN }}
          PUSH_ORIGIN: https://odu-k3s.rooster-blues.ts.net
        run: |
          set -euo pipefail
          paths=$(nix build -L --no-link --print-out-paths --accept-flake-config \
            .#odu .#odu-runner .#web-ui)
          # A positive assertion, not dressing: a build that produced nothing
          # would otherwise push nothing and still report success.
          if [ -z "$paths" ]; then
            echo "::error::nix build produced no output paths"
            exit 1
          fi
          if [ -z "$ODU_CACHE_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::ODU_CACHE_TOKEN is not set on $GITHUB_REPOSITORY — this push would publish no closure. Add a write token for the kolu bucket (a bucket page mints one)."
              exit 1
            fi
            echo "no ODU_CACHE_TOKEN (a pull request) — built, pushed nothing"
            exit 0
          fi
          odu="$(nix build .#odu --no-link --print-out-paths --accept-flake-config)/bin/odu"
          # shellcheck disable=SC2086 # the out-paths are a list
          "$odu" cache push kolu --origin "$PUSH_ORIGIN" $paths

      - name: Bake the declaration the publisher is handed
        env:
          PUSH_ORIGIN: https://odu-k3s.rooster-blues.ts.net
        run: |
          set -euo pipefail
          # THE ONE DECLARATION, with only its FIRST SUBSTITUTER moved: the
          # action takes the push target from it (kolu#2334), so the live pod
          # is named here while `flake.nix` keeps advertising `cache.kolu.dev`.
          # The BUCKET's path form, not the bare origin: the action's VERIFY
          # imports the published paths back from this URL, and the bare origin
          # is the board, whose `Host` is not a bucket (`admitByHost` 404s).
          source=$(nix build .#agent-flake-source --no-link --print-out-paths --accept-flake-config)
          mkdir -p "$RUNNER_TEMP/declaration"
          jq --arg url "$PUSH_ORIGIN/cache/kolu" '.substituters = [$url]' \
            "$source/binary-cache.json" > "$RUNNER_TEMP/declaration/binary-cache.json"

      - uses: actions/upload-artifact@v4
        with:
          name: cache-declaration-${{ matrix.os }}
          path: ${{ runner.temp }}/declaration/binary-cache.json

  publish-closures:
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Writes the `ca-index` branch of this repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The same tree `build-and-push` warmed — see its `ref:` note.
          ref: ${{ github.event.pull_request.head.sha }}

      # The declaration the publisher is handed, built by the job that had a
      # Nix to bake it: the baked sidecar with its first substituter moved to
      # the live pod. A sidecar is the action's own second spelling, so the
      # action still reads one declaration rather than being told a URL.
      - uses: actions/download-artifact@v4
        with:
          name: cache-declaration-${{ matrix.os }}
          path: ${{ runner.temp }}/declaration

      # The action still takes a pinned nixpkgs for the client it may install;
      # the declaration's `pusher` chooses which client pushes.
      - id: inputs
        run: |
          echo "nixpkgs=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_OUTPUT"

      # odu's declaration is `.#agent-flake-source`'s own sidecar + commit-hash
      # (the same derivation the `odu` wrapper bakes), so the action reads them
      # rather than being told. `odu-runner` is the ONE attr a remote resolves.
      # The smoke runs out of the REWRITTEN closure: `--help` loads the runner's
      # whole module graph and exits 0 without needing stdin, which `--stdio`
      # would (it serves until the pipe closes).
      #
      # The pin is kolu's merged head, which carries the `pusher` field the
      # declaration bakes (kolu#2334): the action pushes with
      # `odu cache push kolu` when the declaration says `{ kind = "odu"; … }`.
      # WITH `sidecar`, installables are full flake installables, and the
      # revision the entries are keyed under defaults to the published commit.
      - uses: juspay/kolu/.github/actions/publish-closure@fd831bb1c03db83dccebea90edff3d1fecf386e8
        with:
          sidecar: ${{ runner.temp }}/declaration/binary-cache.json
          installables: .#odu-runner
          latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          smoke: |
            odu-runner=bin/odu-runner --help
          attic-nixpkgs: ${{ steps.inputs.outputs.nixpkgs }}
          odu-cache-token: ${{ secrets.ODU_CACHE_TOKEN }}
